# The thread router's evals: a made-up owner's past threads (`[[thread]]`; never the real owner's), then cases, each
# something the owner says. Every case starts from all the threads, aged as given.
#   thread   the key of the thread it should go in, "new" for a new one, or several ("new | dinner"): any passes
#   closes   whether it should be seen to wrap its thread up (default false; "either" when both are fair)
#   add_to, add   turns said in that thread just now ([said, answer] each), so the conversation is there

