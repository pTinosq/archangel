<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Archangel favicon options</title>
<style>
  body { background: #000; color: #e9e9e4; font: 14px ui-monospace, Menlo, monospace; margin: 32px; }
  .row { display: flex; gap: 48px; flex-wrap: wrap; }
  figure { margin: 0; }
  figcaption { color: #8b8b84; margin-top: 8px; }
  .big { width: 128px; height: 128px; }
  .small { width: 16px; height: 16px; }
  .tab { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding: 6px 10px; background: #0e0e0e; border: 1px solid #1f1f1f; }
</style>
</head>
<body>
<h1>Archangel favicon options</h1>
<div class="row">
  <figure><img class="big" src="favicon-option-1.svg" alt=""><div class="tab"><img class="small" src="favicon-option-1.svg" alt="">Archangel</div><figcaption>1 · peak</figcaption></figure>
  <figure><img class="big" src="favicon-option-2.svg" alt=""><div class="tab"><img class="small" src="favicon-option-2.svg" alt="">Archangel</div><figcaption>2 · halo and wings</figcaption></figure>
  <figure><img class="big" src="favicon-option-3.svg" alt=""><div class="tab"><img class="small" src="favicon-option-3.svg" alt="">Archangel</div><figcaption>3 · eye</figcaption></figure>
</div>
</body>
</html>
