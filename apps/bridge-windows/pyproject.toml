[project]
name = "archangel-bridge-windows"
version = "0.1.0"
description = "Lets Archangel operate a Windows PC: dials the relay and runs its commands."
requires-python = ">=3.13,<3.14"
dependencies = [
    "pillow>=11",
    "pydantic>=2.9",
    "websockets>=14",
    "pywin32>=308; sys_platform == 'win32'",
    "uiautomation>=2.0.20; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "archangel-relay",
    "httpx>=0.27",
    "pyinstaller>=6.11; sys_platform == 'win32'",
]

[tool.uv.sources]
archangel-relay = { path = "../relay" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
